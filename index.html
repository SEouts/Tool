<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employee Availability Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-blue: #2e71ea;
      --accent-red: #e32437;
      --background-dark: #11151a;
      --card-dark: #181e26;
      --text-main: #f4f6fa;
      --text-secondary: #b0b8c9;
      --border-dark: #232939;
      --input-bg: #232939;
      --input-border: #2e71ea33;
      --shadow: 0 4px 24px 0 rgba(46,113,234,0.10);
      --radius: 12px;
      --transition: 0.18s cubic-bezier(.4,0,.2,1);
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Inter', Arial, sans-serif;
      background: var(--background-dark);
      color: var(--text-main);
    }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background: var(--background-dark);
    }
    .dashboard-header {
      display: flex;
      align-items: center;
      background: var(--card-dark);
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border-dark);
      box-shadow: var(--shadow);
    }
    .dashboard-title {
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--primary-blue);
    }
    .dashboard-container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }
    .card {
      background: var(--card-dark);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2rem;
      margin-bottom: 2rem;
      border: 1px solid var(--border-dark);
    }
    .section-title {
      font-size: 1.2rem;
      color: var(--primary-blue);
      font-weight: 600;
      margin-bottom: 1.2rem;
      letter-spacing: 0.01em;
    }
    .input-group {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    input, select, textarea {
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: var(--radius);
      color: var(--text-main);
      padding: 0.6rem 1rem;
      font-size: 1rem;
      transition: border-color var(--transition), box-shadow var(--transition);
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 2px var(--primary-blue)33;
    }
    button {
      background: var(--primary-blue);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 0.7rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition), box-shadow var(--transition);
      box-shadow: 0 2px 8px 0 var(--primary-blue)22;
      margin-right: 0.5rem;
    }
    button:hover, button:focus {
      background: #1852b1;
      box-shadow: 0 4px 16px 0 var(--primary-blue)33;
    }
    .btn-accent {
      background: var(--accent-red);
    }
    .btn-accent:hover {
      background: #a81a28;
    }
    .table-responsive {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: transparent;
      margin-bottom: 1rem;
    }
    th, td {
      padding: 0.9rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border-dark);
      font-size: 1rem;
    }
    th {
      color: var(--primary-blue);
      font-weight: 600;
      background: var(--card-dark);
      border-top: 1px solid var(--border-dark);
    }
    tr {
      transition: background var(--transition);
    }
    tr:hover {
      background: #22304a33;
    }
    .status-pill {
      display: inline-block;
      padding: 0.3em 0.9em;
      border-radius: 999px;
      font-size: 0.95em;
      font-weight: 600;
      background: var(--primary-blue);
      color: #fff;
      letter-spacing: 0.01em;
      margin-right: 0.5em;
    }
    .status-pill.off {
      background: var(--accent-red);
    }
    .status-pill.early {
      background: #fbbf24;
      color: #181e26;
    }
    .status-pill.available {
      background: #22c55e;
      color: #181e26;
    }
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #11151aa0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity var(--transition);
    }
    .modal-content {
      background: var(--card-dark);
      border-radius: var(--radius);
      padding: 2rem;
      min-width: 320px;
      max-width: 90vw;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-dark);
      color: var(--text-main);
    }
    .modal-header {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--primary-blue);
      margin-bottom: 1rem;
    }
    .tab-nav {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1.5px solid var(--border-dark);
    }
    .tab-nav button {
      background: none;
      color: var(--text-secondary);
      border: none;
      border-bottom: 3px solid transparent;
      border-radius: 0;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 0.7rem 1.2rem;
      margin: 0;
      box-shadow: none;
      transition: color var(--transition), border-color var(--transition);
    }
    .tab-nav button.active {
      color: var(--primary-blue);
      border-bottom: 3px solid var(--primary-blue);
      background: #23336633;
    }
    .tab-nav button:hover {
      color: var(--primary-blue);
      background: #22304a22;
    }
    .file-upload {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .file-upload input[type="file"] {
      display: none;
    }
    .file-upload label {
      background: var(--input-bg);
      color: var(--primary-blue);
      border: 1.5px dashed var(--primary-blue);
      border-radius: var(--radius);
      padding: 0.6rem 1.2rem;
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
      font-weight: 500;
    }
    .file-upload label:hover {
      background: #2e71ea22;
      border-color: var(--primary-blue);
    }
    .file-upload .file-name {
      color: var(--text-secondary);
      font-size: 0.98em;
      margin-left: 0.5rem;
    }
    .alert {
      background: var(--accent-red);
      color: #fff;
      border-radius: var(--radius);
      padding: 0.8rem 1.2rem;
      margin-bottom: 1rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      box-shadow: 0 2px 8px 0 var(--accent-red)22;
      border: 1px solid #a81a28;
    }
    /* Scrollbar styling for dark mode */
    ::-webkit-scrollbar {
      width: 10px;
      background: var(--background-dark);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--card-dark);
      border-radius: 6px;
    }
    /* Responsive */
    @media (max-width: 800px) {
      .dashboard-container {
        padding: 0 0.5rem;
      }
      .card {
        padding: 1rem;
      }
      th, td {
        padding: 0.6rem 0.7rem;
      }
    }
    @media (max-width: 500px) {
      .dashboard-header {
        flex-direction: column;
        align-items: flex-start;
        padding: 1rem 0.5rem;
      }
      .dashboard-title {
        font-size: 1.1rem;
      }
      .card {
        padding: 0.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard-header">
    <span class="dashboard-title">Employee Availability Dashboard</span>
  </div>
  <div class="dashboard-container">
    <div class="tab-nav">
      <button class="active">Dashboard</button>
      <button>Reports</button>
      <button>Admin</button>
    </div>
    <div class="card">
      <div class="section-title">Upload Schedule</div>
      <form class="file-upload">
        <label for="schedule-upload">Select File</label>
        <input type="file" id="schedule-upload" />
        <span class="file-name">No file chosen</span>
        <button type="submit">Upload</button>
      </form>
      <div class="section-title" style="margin-top:2rem;">Upload Time Off</div>
      <form class="file-upload">
        <label for="timeoff-upload">Select File</label>
        <input type="file" id="timeoff-upload" />
        <span class="file-name">No file chosen</span>
        <button type="submit">Upload</button>
      </form>
    </div>
    <div class="card">
      <div class="section-title">Current Employee Availability</div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Status</th>
              <th>Shift</th>
              <th>Manager</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Example row -->
            <tr>
              <td>Jane Doe</td>
              <td>
                <span class="status-pill available">Available</span>
              </td>
              <td>9:00 AM - 5:00 PM</td>
              <td>John Smith</td>
              <td>
                <button>Mark Off</button>
                <button class="btn-accent">Left Early</button>
              </td>
            </tr>
            <!-- Add your dynamic rows here -->
          </tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <div class="section-title">Manager Filter</div>
      <div class="input-group">
        <select>
          <option>All Managers</option>
          <option>John Smith</option>
          <option>Emily Clark</option>
        </select>
        <button>Filter</button>
      </div>
    </div>
    <!-- Example Modal (hidden by default, add display: flex to show) -->
    <!--
    <div class="modal" style="display:none;">
      <div class="modal-content">
        <div class="modal-header">Edit Employee</div>
        <form>
          <div class="input-group">
            <input type="text" placeholder="Employee Name" />
            <select>
              <option>Available</option>
              <option>Off</option>
              <option>Left Early</option>
            </select>
          </div>
          <button type="submit">Save</button>
          <button type="button" class="btn-accent">Cancel</button>
        </form>
      </div>
    </div>
    -->
  </div>
  <script>
    // Simple script to show selected file name
    document.querySelectorAll('.file-upload input[type="file"]').forEach(input => {
      input.addEventListener('change', function(){
        const fileName = this.files[0] ? this.files[0].name : 'No file chosen';
        this.parentNode.querySelector('.file-name').textContent = fileName;
      });
    });
    // Tab navigation (for demo)
    document.querySelectorAll('.tab-nav button').forEach(btn => {
      btn.addEventListener('click', function(){
        document.querySelectorAll('.tab-nav button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
